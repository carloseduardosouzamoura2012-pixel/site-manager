<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Lua UI Engine</title>

<style>
body{margin:0;display:flex;height:100vh;font-family:Arial;background:#0d1117;color:white;}
#explorer{width:200px;background:#161b22;padding:10px;overflow:auto;}
#properties{width:200px;background:#161b22;padding:10px;}
#canvas{flex:1;background:#222;position:relative;}
.item{cursor:pointer;padding:5px;background:#21262d;margin:4px 0;border-radius:6px;}
.gui{position:absolute;padding:5px;border:none;}
input{width:100%;margin:4px 0;}
button{width:100%;margin:4px 0;padding:6px;border:none;border-radius:6px;}
</style>
</head>

<body>

<div id="explorer">
<h3>Explorer</h3>
<button onclick="addScreenGui()">+ ScreenGui</button>
<button onclick="addTextButton()">+ TextButton</button>
<button onclick="addTextLabel()">+ TextLabel</button>
<div id="tree"></div>
</div>

<div id="canvas"></div>

<div id="properties">
<h3>Properties</h3>
<div id="props"></div>
<h3>Script</h3>
<textarea id="scriptArea" style="width:100%;height:100px;"></textarea>
<button onclick="runScript()">Run Script</button>
</div>

<script>
let objects=[];
let selected=null;
let idCounter=0;

function refreshExplorer(){
let tree=document.getElementById("tree");
tree.innerHTML="";
objects.forEach(obj=>{
tree.innerHTML+=`<div class="item" onclick="selectObj(${obj.id})">${obj.name}</div>`;
});
}

function selectObj(id){
selected=objects.find(o=>o.id===id);
showProperties();
}

function showProperties(){
let p=document.getElementById("props");
if(!selected) return;
p.innerHTML=`
Name:<input value="${selected.name}" onchange="selected.name=this.value;refreshExplorer()">
X:<input value="${selected.x}" onchange="updateProp('x',this.value)">
Y:<input value="${selected.y}" onchange="updateProp('y',this.value)">
Width:<input value="${selected.w}" onchange="updateProp('w',this.value)">
Height:<input value="${selected.h}" onchange="updateProp('h',this.value)">
Text:<input value="${selected.text}" onchange="updateProp('text',this.value)">
`;
document.getElementById("scriptArea").value=selected.script||"";
}

function updateProp(prop,val){
selected[prop]=val;
render();
}

function render(){
document.getElementById("canvas").innerHTML="";
objects.forEach(obj=>{
let el;
if(obj.type==="TextButton"){
el=document.createElement("button");
el.innerText=obj.text;
}
if(obj.type==="TextLabel"){
el=document.createElement("div");
el.innerText=obj.text;
el.style.color="white";
}
el.className="gui";
el.style.left=obj.x+"px";
el.style.top=obj.y+"px";
el.style.width=obj.w+"px";
el.style.height=obj.h+"px";
document.getElementById("canvas").appendChild(el);
});
}

function addScreenGui(){
alert("ScreenGui criado (simples container)");
}

function addTextButton(){
idCounter++;
objects.push({
id:idCounter,
type:"TextButton",
name:"TextButton"+idCounter,
x:50,y:50,w:100,h:40,
text:"Button",
script:""
});
refreshExplorer();
render();
}

function addTextLabel(){
idCounter++;
objects.push({
id:idCounter,
type:"TextLabel",
name:"TextLabel"+idCounter,
x:70,y:120,w:120,h:30,
text:"Label",
script:""
});
refreshExplorer();
render();
}

function runScript(){
if(!selected) return;
selected.script=document.getElementById("scriptArea").value;

let lua=selected.script;

lua=lua.replace(/print/g,"console.log");
lua=lua.replace(/script.Parent/g,"selectedElement");

try{
eval(lua);
}catch(e){
alert("Erro: "+e.message);
}
}
</script>

</body>
</html>
