<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bluber Engine 2D</title>

<style>
body{
margin:0;
background:#1e1e1e;
font-family:Arial;
overflow:hidden;
touch-action:none;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

/* TOPBAR */
#topbar{
height:55px;
background:#111;
display:flex;
align-items:center;
gap:8px;
padding:6px;
flex-shrink:0;
}

button{
background:#3a3a3a;
border:none;
border-radius:10px;
padding:8px 12px;
font-size:13px;
color:white;
}

/* ÁREA PRINCIPAL */
#main{
flex:1;
display:flex;
overflow:hidden;
}

/* PAINÉIS */
#explorer{
width:220px;
background:#181818;
overflow-y:auto;
padding:10px;
border-right:1px solid #333;
}

#properties{
width:300px;
background:#181818;
overflow-y:auto;
padding:15px;
border-left:1px solid #333;
}

#workspace{
flex:1;
background:#222;
display:flex;
justify-content:center;
align-items:center;
}

canvas{
background:#111;
max-width:100%;
max-height:100%;
}

/* SEÇÕES */
.section{
margin-bottom:20px;
padding-bottom:10px;
border-bottom:1px solid #333;
}

.section h4{
margin:5px 0;
color:#4da6ff;
}

input[type="range"]{
width:100%;
}

input[type="color"],
select,
textarea{
width:100%;
margin-top:5px;
margin-bottom:10px;
background:#2b2b2b;
color:white;
border:none;
padding:6px;
border-radius:6px;
}

/* JOYSTICK */
.joystick{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.1);
bottom:30px;
left:30px;
display:none;
}

.knob{
position:absolute;
width:60px;
height:60px;
border-radius:50%;
background:rgba(255,255,255,0.6);
top:30px;
left:30px;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="addBlock()">Add Block</button>
<button onclick="togglePlay()">Play</button>
<button onclick="exportProject()">Export</button>
<button onclick="importProject()">Import</button>
</div>

<div id="main">
<div id="explorer"><h3>Explorer</h3><div id="list"></div></div>
<div id="workspace"><canvas id="game"></canvas></div>
<div id="properties"><h3>Properties</h3><div id="props"></div></div>
</div>

<div class="joystick" id="joy">
<div class="knob" id="knob"></div>
</div>

<script>

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

function resizeCanvas(){
canvas.width=canvas.parentElement.clientWidth;
canvas.height=canvas.parentElement.clientHeight;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

let blocks=[];
let selected=null;
let playMode=false;
let player=null;
let startPos={x:100,y:100};

function addBlock(){
blocks.push({
name:"Block"+blocks.length,
x:100,y:100,w:80,h:80,
color:"#ffffff",
type:"normal"
});
updateExplorer();
}

function updateExplorer(){
let list=document.getElementById("list");
list.innerHTML="";
blocks.forEach(obj=>{
let div=document.createElement("div");
div.innerText=obj.name;
div.onclick=()=>select(obj);
list.appendChild(div);
});
}

function select(obj){
selected=obj;
showProperties();
}

function showProperties(){
let p=document.getElementById("props");
p.innerHTML="";
if(!selected)return;

let sec=document.createElement("div");
sec.className="section";
sec.innerHTML="<h4>Transform</h4>";
p.appendChild(sec);

createSlider(sec,"X","x");
createSlider(sec,"Y","y");
createSlider(sec,"Width","w");
createSlider(sec,"Height","h");

let color=document.createElement("input");
color.type="color";
color.value=selected.color;
color.oninput=()=>selected.color=color.value;
p.appendChild(color);

let type=document.createElement("select");
type.innerHTML="<option value='normal'>Normal</option><option value='player'>Player</option><option value='monster'>Monster</option>";
type.value=selected.type;
type.onchange=()=>selected.type=type.value;
p.appendChild(type);
}

function createSlider(parent,label,key){
let labelEl=document.createElement("div");
labelEl.innerText=label;
parent.appendChild(labelEl);

let input=document.createElement("input");
input.type="range";
input.min=0;
input.max=1000;
input.value=selected[key];
input.oninput=()=>selected[key]=Number(input.value);
parent.appendChild(input);
}

function togglePlay(){
playMode=!playMode;
document.getElementById("joy").style.display=playMode?"block":"none";
if(playMode){
player=blocks.find(b=>b.type=="player");
if(player){
startPos.x=player.x;
startPos.y=player.y;
}
}
}

function collide(a,b){
return a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y;
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
});

if(playMode){
blocks.forEach(b=>{
if(b.type=="monster"&&player){
let dx=player.x-b.x;
let dy=player.y-b.y;
b.x+=dx*0.02;
b.y+=dy*0.02;
if(collide(b,player)){
player.x=startPos.x;
player.y=startPos.y;
}
}
});
}

requestAnimationFrame(loop);
}
loop();

/* JOYSTICK */
let joy=document.getElementById("joy");
let knob=document.getElementById("knob");

joy.onpointermove=e=>{
if(!playMode||!player)return;
let rect=joy.getBoundingClientRect();
let x=e.clientX-rect.left-60;
let y=e.clientY-rect.top-60;
let max=30;
x=Math.max(-max,Math.min(max,x));
y=Math.max(-max,Math.min(max,y));
knob.style.left=(x+30)+"px";
knob.style.top=(y+30)+"px";
player.x+=x*0.1;
player.y+=y*0.1;
};

joy.onpointerup=()=>{
knob.style.left="30px";
knob.style.top="30px";
};

function exportProject(){
let blob=new Blob([JSON.stringify(blocks)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="BluberProject.json";
a.click();
}

function importProject(){
let input=document.createElement("input");
input.type="file";
input.accept=".json";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=ev=>{
blocks=JSON.parse(ev.target.result);
updateExplorer();
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

</script>
</body>
</html>
