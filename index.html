<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Web Studio</title>
<style>
body{margin:0;font-family:Arial;background:#0d1117;color:white;display:flex;height:100vh;}
.sidebar{width:250px;background:#161b22;padding:10px;overflow:auto;}
.main{flex:1;display:flex;flex-direction:column;}
.topbar{background:#21262d;padding:10px;display:flex;gap:10px;}
.editor{flex:1;display:flex;}
textarea{flex:1;background:#0d1117;color:#00ffcc;border:none;padding:10px;}
iframe{flex:1;border:none;background:white;}
button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;}
.create{background:#238636;color:white;}
.delete{background:#d73a49;color:white;}
input{width:100%;margin:5px 0;padding:6px;border-radius:6px;border:none;}
.repoItem{background:#21262d;padding:6px;margin:5px 0;cursor:pointer;border-radius:6px;}
</style>
</head>
<body>

<div class="sidebar">
<h3>Projetos</h3>
<input id="token" type="password" placeholder="Token GitHub">
<input id="novoRepo" placeholder="Novo Projeto">
<button class="create" onclick="criarRepo()">Criar</button>
<button onclick="listar()">Atualizar Lista</button>
<div id="lista"></div>
</div>

<div class="main">
<div class="topbar">
<button class="create" onclick="salvar()">Publicar</button>
<button onclick="desativar()">Desativar Pages</button>
<button class="delete" onclick="excluir()">Excluir</button>
<span id="status"></span>
</div>

<div class="editor">
<textarea id="codigo" oninput="preview()"></textarea>
<iframe id="preview"></iframe>
</div>
</div>

<script>
let repoAtual=null;
let shaAtual=null;
let usuario=null;

async function getUser(){
let token=document.getElementById("token").value.trim();
let r=await fetch("https://api.github.com/user",{headers:{Authorization:"token "+token}});
let d=await r.json();
usuario=d.login;
}

async function listar(){
let token=document.getElementById("token").value.trim();
await getUser();
let r=await fetch("https://api.github.com/user/repos",{headers:{Authorization:"token "+token}});
let repos=await r.json();
let lista=document.getElementById("lista");
lista.innerHTML="";
repos.forEach(repo=>{
lista.innerHTML+=`<div class="repoItem" onclick="abrir('${repo.name}')">${repo.name}</div>`;
});
}

async function abrir(nome){
repoAtual=nome;
let token=document.getElementById("token").value.trim();
await getUser();
let r=await fetch(`https://api.github.com/repos/${usuario}/${nome}/contents/index.html`,
{headers:{Authorization:"token "+token}});
let d=await r.json();
shaAtual=d.sha;
document.getElementById("codigo").value=atob(d.content);
preview();
}

async function criarRepo(){
let nome=document.getElementById("novoRepo").value.trim();
let token=document.getElementById("token").value.trim();
await fetch("https://api.github.com/user/repos",{
method:"POST",
headers:{Authorization:"token "+token,Accept:"application/vnd.github+json"},
body:JSON.stringify({name:nome,public:true})
});
alert("Projeto criado");
listar();
}

async function salvar(){
if(!repoAtual) return alert("Abra um projeto");
let token=document.getElementById("token").value.trim();
let codigo=document.getElementById("codigo").value;
await getUser();
await fetch(`https://api.github.com/repos/${usuario}/${repoAtual}/contents/index.html`,{
method:"PUT",
headers:{Authorization:"token "+token,Accept:"application/vnd.github+json"},
body:JSON.stringify({
message:"Atualização",
content:btoa(unescape(encodeURIComponent(codigo))),
sha:shaAtual
})
});
document.getElementById("status").innerText="Atualizando...";
setTimeout(()=>{
document.getElementById("status").innerHTML=
`Pronto! <a href="https://${usuario}.github.io/${repoAtual}" target="_blank">Abrir</a>`;
},60000);
}

async function excluir(){
if(!repoAtual) return;
let token=document.getElementById("token").value.trim();
await getUser();
if(!confirm("Excluir permanentemente?")) return;
await fetch(`https://api.github.com/repos/${usuario}/${repoAtual}`,{
method:"DELETE",
headers:{Authorization:"token "+token}
});
alert("Excluído");
listar();
}

async function desativar(){
if(!repoAtual) return;
let token=document.getElementById("token").value.trim();
await getUser();
await fetch(`https://api.github.com/repos/${usuario}/${repoAtual}/pages`,{
method:"DELETE",
headers:{Authorization:"token "+token}
});
alert("Pages desativado");
}

function preview(){
document.getElementById("preview").srcdoc=
document.getElementById("codigo").value;
}
</script>

</body>
</html>
