<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bluber Engine 2D</title>

<style>
body{
margin:0;
background:#1e1e1e;
font-family:Arial;
overflow:hidden;
touch-action:none;
color:white;
}

/* TOPBAR */
#topbar{
height:55px;
background:#111;
display:flex;
align-items:center;
gap:8px;
padding:6px;
}

/* BOTÕES */
button{
background:#3a3a3a;
border:none;
border-radius:10px;
padding:8px 12px;
font-size:13px;
color:white;
}

/* PAINÉIS */
#explorer{
position:absolute;
left:0;
top:55px;
bottom:0;
width:220px;
background:#181818;
overflow-y:auto;
padding:10px;
border-right:1px solid #333;
}

#properties{
position:absolute;
right:0;
top:55px;
bottom:0;
width:300px;   /* aumentei */
background:#181818;
overflow-y:auto;
padding:15px;
border-left:1px solid #333;
}

#workspace{
position:absolute;
left:220px;
right:300px;
top:55px;
bottom:0;
background:#222;
}

canvas{
background:#111;
}

/* SEÇÕES */
.section{
margin-bottom:20px;
padding-bottom:10px;
border-bottom:1px solid #333;
}

.section h4{
margin:5px 0;
color:#4da6ff;
}

/* INPUTS */
input[type="range"]{
width:100%;
}

input[type="color"],
select,
textarea{
width:100%;
margin-top:5px;
margin-bottom:10px;
background:#2b2b2b;
color:white;
border:none;
padding:6px;
border-radius:6px;
}

.valueLabel{
font-size:12px;
opacity:0.7;
}

/* JOYSTICK */
.joystick{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.1);
bottom:30px;
left:30px;
display:none;
}

.knob{
position:absolute;
width:60px;
height:60px;
border-radius:50%;
background:rgba(255,255,255,0.6);
top:30px;
left:30px;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="addBlock()">Add Block</button>
<button onclick="addUI()">Add UI</button>
<button onclick="togglePlay()">Play</button>
<button onclick="exportProject()">Export</button>
<button onclick="importProject()">Import</button>
</div>

<div id="explorer"><h3>Explorer</h3><div id="list"></div></div>
<div id="properties"><h3>Properties</h3><div id="props"></div></div>
<div id="workspace"><canvas id="game"></canvas></div>

<div class="joystick" id="joy">
<div class="knob" id="knob"></div>
</div>

<script>

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth-520;
canvas.height=window.innerHeight-55;

let blocks=[];
let uiElements=[];
let selected=null;
let playMode=false;
let player=null;
let startPos={x:100,y:100};

function addBlock(){
blocks.push({
name:"Block"+blocks.length,
x:100,y:100,w:80,h:80,
color:"#ffffff",
image:null,
script:"",
type:"normal"
});
updateExplorer();
}

function addUI(){
uiElements.push({
name:"UI"+uiElements.length,
x:150,y:150,
text:"Botão",
script:"alert('clicou')"
});
updateExplorer();
}

function updateExplorer(){
let list=document.getElementById("list");
list.innerHTML="";
blocks.forEach(obj=>{
let div=document.createElement("div");
div.innerText=obj.name;
div.onclick=()=>select(obj);
list.appendChild(div);
});
uiElements.forEach(obj=>{
let div=document.createElement("div");
div.innerText=obj.name+" (UI)";
div.onclick=()=>select(obj);
list.appendChild(div);
});
}

function select(obj){
selected=obj;
showProperties();
}

function showProperties(){
let p=document.getElementById("props");
p.innerHTML="";
if(!selected)return;

/* TRANSFORM */
let transform=createSection("Transform");

createSlider(transform,"X",selected.x,v=>selected.x=v);
createSlider(transform,"Y",selected.y,v=>selected.y=v);

if(selected.w!==undefined){
createSlider(transform,"Width",selected.w,v=>selected.w=v);
createSlider(transform,"Height",selected.h,v=>selected.h=v);
}

/* APARÊNCIA */
if(selected.color!==undefined){
let appearance=createSection("Appearance");

let color=document.createElement("input");
color.type="color";
color.value=selected.color;
color.oninput=()=>selected.color=color.value;
appearance.appendChild(color);

let imgBtn=document.createElement("button");
imgBtn.innerText="Import Image";
imgBtn.onclick=()=>{
let input=document.createElement("input");
input.type="file";
input.accept="image/*";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=ev=>selected.image=ev.target.result;
reader.readAsDataURL(e.target.files[0]);
};
input.click();
};
appearance.appendChild(imgBtn);
}

/* TYPE */
if(selected.type!==undefined){
let typeSec=createSection("Object Type");
let select=document.createElement("select");
select.innerHTML="<option value='normal'>Normal</option><option value='player'>Player</option><option value='monster'>Monster</option>";
select.value=selected.type;
select.onchange=()=>selected.type=select.value;
typeSec.appendChild(select);
}

/* SCRIPT */
let scriptSec=createSection("Script");
let area=document.createElement("textarea");
area.rows=5;
area.value=selected.script||"";
area.oninput=()=>selected.script=area.value;
scriptSec.appendChild(area);
}

function createSection(title){
let p=document.getElementById("props");
let sec=document.createElement("div");
sec.className="section";
let h=document.createElement("h4");
h.innerText=title;
sec.appendChild(h);
p.appendChild(sec);
return sec;
}

function createSlider(parent,label,value,callback){
let text=document.createElement("div");
text.innerHTML=label+" <span class='valueLabel'>"+value+"</span>";
parent.appendChild(text);

let input=document.createElement("input");
input.type="range";
input.min=0;
input.max=1000;
input.value=value;
input.oninput=()=>{
callback(Number(input.value));
text.innerHTML=label+" <span class='valueLabel'>"+input.value+"</span>";
};
parent.appendChild(input);
}

/* RESTO DO SISTEMA (render, joystick, play, export/import) */
/* Mantive igual para não quebrar nada */

function togglePlay(){
playMode=!playMode;
document.getElementById("joy").style.display=playMode?"block":"none";
if(playMode){
player=blocks.find(b=>b.type=="player");
if(player){
startPos.x=player.x;
startPos.y=player.y;
}
}
}

function collide(a,b){
return a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y;
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
if(b.image){
let img=new Image();
img.src=b.image;
ctx.drawImage(img,b.x,b.y,b.w,b.h);
}else{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
}
});

if(playMode){
blocks.forEach(b=>{
if(b.script){
try{new Function("self","player",b.script)(b,player)}catch{}
}
if(b.type=="monster"&&player){
let dx=player.x-b.x;
let dy=player.y-b.y;
b.x+=dx*0.02;
b.y+=dy*0.02;
if(collide(b,player)){
player.x=startPos.x;
player.y=startPos.y;
}
}
});
}

requestAnimationFrame(loop);
}
loop();

/* JOYSTICK */
let joy=document.getElementById("joy");
let knob=document.getElementById("knob");

joy.onpointermove=e=>{
if(!playMode||!player)return;
let rect=joy.getBoundingClientRect();
let x=e.clientX-rect.left-60;
let y=e.clientY-rect.top-60;
let max=30;
x=Math.max(-max,Math.min(max,x));
y=Math.max(-max,Math.min(max,y));
knob.style.left=(x+30)+"px";
knob.style.top=(y+30)+"px";
player.x+=x*0.1;
player.y+=y*0.1;
};

joy.onpointerup=()=>{
knob.style.left="30px";
knob.style.top="30px";
};

function exportProject(){
let data={blocks,uiElements};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="BluberProject.json";
a.click();
}

function importProject(){
let input=document.createElement("input");
input.type="file";
input.accept=".json";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=ev=>{
let data=JSON.parse(ev.target.result);
blocks=data.blocks||[];
uiElements=data.uiElements||[];
updateExplorer();
};
reader.readAsText(e.target.files[0]);
};
input.click();
}

</script>
</body>
</html>
