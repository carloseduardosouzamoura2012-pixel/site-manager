<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ultra 2D Engine</title>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:Arial;}
canvas{background:#222;display:block;}
#ui{
position:fixed;
top:10px;
left:10px;
background:#000c;
padding:10px;
border-radius:10px;
color:white;
width:250px;
}
button,input{margin:5px;width:100%;}
textarea{width:100%;height:80px;}
</style>
</head>
<body>

<div id="ui">
<button onclick="addBlock()">Adicionar Bloco</button>
<button onclick="addScript()">Adicionar Script</button>
<input type="file" id="imgLoader">
<button onclick="exportProject()">Exportar Projeto</button>
<button onclick="importProject()">Importar Projeto</button>
<textarea id="scriptArea" placeholder="Script JS do bloco selecionado"></textarea>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let blocks=[];
let selected=null;
let dragging=false;

let player={
x:0,y:0,w:40,h:40,vy:0,ground:false
};

function addBlock(){
let block={
x:100,
y:100,
w:100,
h:50,
color:"white",
img:null,
script:""
};
blocks.push(block);
if(blocks.length===1){
player.x=block.x;
player.y=block.y-40;
}
}

function addScript(){
if(selected){
selected.script=document.getElementById("scriptArea").value;
}
}

canvas.addEventListener("mousedown",e=>{
let mx=e.clientX;
let my=e.clientY;
selected=null;
blocks.forEach(b=>{
if(mx>b.x && mx<b.x+b.w && my>b.y && my<b.y+b.h){
selected=b;
document.getElementById("scriptArea").value=b.script;
}
});
dragging=true;
});

canvas.addEventListener("mousemove",e=>{
if(dragging && selected){
selected.x=e.clientX-selected.w/2;
selected.y=e.clientY-selected.h/2;
}
});

canvas.addEventListener("mouseup",()=>dragging=false);

document.getElementById("imgLoader").addEventListener("change",e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(event){
if(selected){
let img=new Image();
img.src=event.target.result;
selected.img=img;
}
}
reader.readAsDataURL(file);
});

function update(){
player.vy+=0.5;
player.y+=player.vy;
player.ground=false;

blocks.forEach(b=>{
if(player.x<b.x+b.w &&
player.x+player.w>b.x &&
player.y<b.y+b.h &&
player.y+player.h>b.y){
player.y=b.y-player.h;
player.vy=0;
player.ground=true;
}
if(b.script){
try{
eval(b.script);
}catch(e){}
}
});

draw();
requestAnimationFrame(update);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
if(b.img){
ctx.drawImage(b.img,b.x,b.y,b.w,b.h);
}else{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
}
});

ctx.fillStyle="lime";
ctx.fillRect(player.x,player.y,player.w,player.h);
}

function exportProject(){
let data=JSON.stringify(blocks);
let blob=new Blob([data],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="projeto.json";
a.click();
}

function importProject(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(event){
blocks=JSON.parse(event.target.result);
};
reader.readAsText(file);
};
input.click();
}

update();
</script>

</body>
</html>
