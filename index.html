<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluber Engine 2D</title>
<style>
body{
margin:0;
background:#0f0f0f;
font-family:Segoe UI,Arial;
overflow:hidden;
color:white;
}

/* JANELAS */
.window{
position:absolute;
background:#1c1c1c;
border:1px solid #333;
border-radius:8px;
display:flex;
flex-direction:column;
resize:both;
overflow:hidden;
}

.header{
background:#2a2a2a;
padding:6px;
cursor:move;
font-weight:bold;
font-size:14px;
}

.content{
flex:1;
overflow:auto;
padding:8px;
}

/* Layout */
#viewport{top:10px;left:10px;width:60%;height:70%;}
#hierarchy{top:10px;right:10px;width:35%;height:30%;}
#inspector{top:42%;right:10px;width:35%;height:38%;}
#assets{bottom:10px;left:10px;width:60%;height:25%;}

/* UI */
button,input,textarea{
width:100%;
margin-top:5px;
background:#2a2a2a;
border:1px solid #444;
color:white;
padding:6px;
border-radius:5px;
}

button:hover{background:#3a3a3a;}

canvas{background:#222;width:100%;height:100%;}
.list-item{
padding:4px;
background:#2a2a2a;
margin-top:3px;
cursor:pointer;
border-radius:4px;
}
.list-item:hover{background:#3a3a3a;}
.selected{background:#0066ff;}
</style>
</head>
<body>

<div class="window" id="viewport">
<div class="header">Bluber Engine 2D - Viewport</div>
<canvas id="game"></canvas>
</div>

<div class="window" id="hierarchy">
<div class="header">Hierarchy</div>
<div class="content" id="hierarchyList"></div>
</div>

<div class="window" id="inspector">
<div class="header">Inspector</div>
<div class="content">
<label>X</label><input id="propX">
<label>Y</label><input id="propY">
<label>Width</label><input id="propW">
<label>Height</label><input id="propH">
<label>Script JS</label>
<textarea id="scriptArea"></textarea>
<button onclick="applyChanges()">Aplicar</button>
</div>
</div>

<div class="window" id="assets">
<div class="header">Assets</div>
<div class="content">
<button onclick="addBlock()">Adicionar Bloco</button>
<button onclick="toggleMode()">Play / Edit</button>
<button onclick="saveProject()">Exportar JSON</button>
<button onclick="loadProject()">Importar JSON</button>
<input type="file" id="imgLoader">
</div>
</div>

<script>
/* DRAG WINDOWS */
document.querySelectorAll(".window").forEach(win=>{
let header=win.querySelector(".header");
let offsetX,offsetY,isDown=false;
header.onmousedown=e=>{
isDown=true;
offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;
}
document.onmouseup=()=>isDown=false;
document.onmousemove=e=>{
if(isDown){
win.style.left=e.clientX-offsetX+"px";
win.style.top=e.clientY-offsetY+"px";
}
}
});

/* ENGINE CORE */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=800;
canvas.height=500;

let blocks=[];
let selected=null;
let mode="edit";

let player={x:0,y:0,w:40,h:40,vy:0};

/* OBJECT SYSTEM */
function addBlock(){
let block={
id:Date.now(),
name:"Block "+(blocks.length+1),
x:100,y:100,w:100,h:60,
color:"#ffffff",
script:"",
img:null
};
blocks.push(block);
if(blocks.length===1){
player.x=block.x;
player.y=block.y-40;
}
refreshHierarchy();
}

/* HIERARCHY */
function refreshHierarchy(){
let list=document.getElementById("hierarchyList");
list.innerHTML="";
blocks.forEach(b=>{
let div=document.createElement("div");
div.className="list-item";
div.innerText=b.name;
div.onclick=()=>{
selected=b;
updateInspector();
refreshHierarchy();
};
if(selected===b)div.classList.add("selected");
list.appendChild(div);
});
}

/* INSPECTOR */
function updateInspector(){
if(!selected)return;
propX.value=selected.x;
propY.value=selected.y;
propW.value=selected.w;
propH.value=selected.h;
scriptArea.value=selected.script;
}

function applyChanges(){
if(!selected)return;
selected.x=parseInt(propX.value);
selected.y=parseInt(propY.value);
selected.w=parseInt(propW.value);
selected.h=parseInt(propH.value);
selected.script=scriptArea.value;
}

/* PLAY MODE */
function toggleMode(){
mode = mode==="edit" ? "play" : "edit";
}

/* IMAGE IMPORT */
imgLoader.addEventListener("change",e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(event){
if(selected){
let img=new Image();
img.src=event.target.result;
selected.img=img;
}
}
reader.readAsDataURL(file);
});

/* SAVE / LOAD */
function saveProject(){
let project={
engine:"Bluber Engine 2D",
version:"1.0",
blocks:blocks
};
localStorage.setItem("bluberSave",JSON.stringify(project));
let blob=new Blob([JSON.stringify(project)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="BluberProject.json";
a.click();
}

function loadProject(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(event){
let project=JSON.parse(event.target.result);
blocks=project.blocks||[];
refreshHierarchy();
};
reader.readAsText(file);
};
input.click();
}

function autoLoad(){
let saved=localStorage.getItem("bluberSave");
if(saved){
let project=JSON.parse(saved);
blocks=project.blocks||[];
refreshHierarchy();
}
}
autoLoad();

/* GAME LOOP */
function update(){
if(mode==="play"){
player.vy+=0.5;
player.y+=player.vy;

blocks.forEach(b=>{
if(player.x<b.x+b.w &&
player.x+player.w>b.x &&
player.y<b.y+b.h &&
player.y+player.h>b.y){
player.y=b.y-player.h;
player.vy=0;
}
if(b.script){
try{eval(b.script);}catch(e){}
}
});
}
draw();
requestAnimationFrame(update);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
if(b.img){
ctx.drawImage(b.img,b.x,b.y,b.w,b.h);
}else{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
}
});

ctx.fillStyle="#00ff00";
ctx.fillRect(player.x,player.y,player.w,player.h);
}

update();
</script>
</body>
</html>
