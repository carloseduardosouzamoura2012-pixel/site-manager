<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bluber Engine 2D</title>

<style>
body{
margin:0;
background:#1e1e1e;
font-family:Arial;
overflow:hidden;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

#topbar{
height:50px;
background:#111;
display:flex;
align-items:center;
gap:8px;
padding:5px;
flex-shrink:0;
}

button{
background:#3a3a3a;
border:none;
border-radius:8px;
padding:6px 10px;
color:white;
}

#main{
flex:1;
display:flex;
overflow:hidden;
}

.panel{
background:#181818;
overflow:auto;
padding:10px;
}

#explorer{width:180px;border-right:1px solid #333;}
#properties{width:260px;border-left:1px solid #333;}
#uiEditor{width:200px;border-left:1px solid #333;}
#workspace{flex:1;display:flex;justify-content:center;align-items:center;background:#222;}

canvas{background:#111;}

.section{
margin-bottom:15px;
border-bottom:1px solid #333;
padding-bottom:10px;
}

input,select,textarea{
width:100%;
margin-top:5px;
margin-bottom:8px;
background:#2b2b2b;
color:white;
border:none;
padding:5px;
border-radius:6px;
}

.joystick{
position:absolute;
width:120px;
height:120px;
border-radius:50%;
background:rgba(255,255,255,0.1);
bottom:30px;
left:30px;
display:none;
}

.knob{
position:absolute;
width:60px;
height:60px;
border-radius:50%;
background:rgba(255,255,255,0.6);
top:30px;
left:30px;
}

.gameUI{
position:absolute;
}
</style>
</head>

<body>

<div id="topbar">
<button onclick="addBlock()">Add Block</button>
<button onclick="addUIButton()">Add UI Button</button>
<button onclick="addUIText()">Add UI Text</button>
<button onclick="togglePlay()">Play</button>
</div>

<div id="main">
<div id="explorer" class="panel"><h3>Explorer</h3><div id="list"></div></div>
<div id="workspace"><canvas id="game"></canvas></div>
<div id="properties" class="panel"><h3>Properties</h3><div id="props"></div></div>
<div id="uiEditor" class="panel"><h3>UI Editor</h3><div id="uiList"></div></div>
</div>

<div class="joystick" id="joy"><div class="knob" id="knob"></div></div>

<script>

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

function resizeCanvas(){
canvas.width=canvas.parentElement.clientWidth;
canvas.height=canvas.parentElement.clientHeight;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

let blocks=[];
let uiElements=[];
let selected=null;
let playMode=false;
let player=null;
let startPos={x:100,y:100};

/* ---------- CRIAÇÃO ---------- */

function addBlock(){
blocks.push({
name:"Block"+blocks.length,
x:100,y:100,w:80,h:80,
color:"#ffffff",
image:null,
script:"",
type:"normal"
});
updateExplorer();
}

function addUIButton(){
uiElements.push({
name:"UIButton"+uiElements.length,
type:"button",
x:200,y:200,
text:"Button",
script:""
});
updateUIEditor();
renderUI();
}

function addUIText(){
uiElements.push({
name:"UIText"+uiElements.length,
type:"text",
x:200,y:250,
text:"Text",
script:""
});
updateUIEditor();
renderUI();
}

/* ---------- EXPLORER ---------- */

function updateExplorer(){
let list=document.getElementById("list");
list.innerHTML="";
blocks.forEach(obj=>{
let div=document.createElement("div");
div.innerText=obj.name;
div.onclick=()=>select(obj);
list.appendChild(div);
});
}

function updateUIEditor(){
let list=document.getElementById("uiList");
list.innerHTML="";
uiElements.forEach(obj=>{
let div=document.createElement("div");
div.innerText=obj.name;
div.onclick=()=>select(obj);
list.appendChild(div);
});
}

/* ---------- PROPERTIES ---------- */

function select(obj){
selected=obj;
showProperties();
}

function showProperties(){
let p=document.getElementById("props");
p.innerHTML="";
if(!selected)return;

let temp=JSON.parse(JSON.stringify(selected));

function section(title){
let s=document.createElement("div");
s.className="section";
s.innerHTML="<b>"+title+"</b>";
p.appendChild(s);
return s;
}

let transform=section("Transform");
["x","y"].forEach(k=>{
let input=document.createElement("input");
input.type="range";
input.min=0;
input.max=1000;
input.value=temp[k];
input.oninput=()=>temp[k]=Number(input.value);
transform.appendChild(document.createTextNode(k.toUpperCase()));
transform.appendChild(input);
});

if(temp.w!==undefined){
["w","h"].forEach(k=>{
let input=document.createElement("input");
input.type="range";
input.min=0;
input.max=1000;
input.value=temp[k];
input.oninput=()=>temp[k]=Number(input.value);
transform.appendChild(document.createTextNode(k.toUpperCase()));
transform.appendChild(input);
});

let appearance=section("Appearance");

let color=document.createElement("input");
color.type="color";
color.value=temp.color;
color.oninput=()=>temp.color=color.value;
appearance.appendChild(color);

let imgBtn=document.createElement("button");
imgBtn.innerText="Import Image";
imgBtn.onclick=()=>{
let input=document.createElement("input");
input.type="file";
input.accept="image/*";
input.onchange=e=>{
let reader=new FileReader();
reader.onload=ev=>temp.image=ev.target.result;
reader.readAsDataURL(e.target.files[0]);
};
input.click();
};
appearance.appendChild(imgBtn);

let typeSelect=document.createElement("select");
typeSelect.innerHTML="<option value='normal'>Normal</option><option value='player'>Player</option><option value='monster'>Monster</option>";
typeSelect.value=temp.type;
typeSelect.onchange=()=>temp.type=typeSelect.value;
appearance.appendChild(typeSelect);
}

let scriptSec=section("Script");
let area=document.createElement("textarea");
area.rows=4;
area.value=temp.script||"";
area.oninput=()=>temp.script=area.value;
scriptSec.appendChild(area);

let apply=document.createElement("button");
apply.innerText="Aplicar";
apply.onclick=()=>{
Object.assign(selected,temp);
renderUI();
};
p.appendChild(apply);
}

/* ---------- RENDER ---------- */

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
if(b.image){
let img=new Image();
img.src=b.image;
ctx.drawImage(img,b.x,b.y,b.w,b.h);
}else{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
}
});

if(playMode){
blocks.forEach(b=>{
if(b.script){
try{new Function("self","player",b.script)(b,player)}catch{}
}
if(b.type=="monster"&&player){
let dx=player.x-b.x;
let dy=player.y-b.y;
b.x+=dx*0.02;
b.y+=dy*0.02;
if(collide(b,player)){
player.x=startPos.x;
player.y=startPos.y;
}
}
});
}

requestAnimationFrame(loop);
}
loop();

function renderUI(){
document.querySelectorAll(".gameUI").forEach(e=>e.remove());
uiElements.forEach(u=>{
let el;
if(u.type=="button"){
el=document.createElement("button");
el.innerText=u.text;
}else{
el=document.createElement("div");
el.innerText=u.text;
}
el.className="gameUI";
el.style.left=u.x+"px";
el.style.top=u.y+"px";
el.onclick=()=>{if(u.script) new Function(u.script)();};
document.body.appendChild(el);
});
}

/* ---------- PLAY ---------- */

function togglePlay(){
playMode=!playMode;
document.getElementById("joy").style.display=playMode?"block":"none";
if(playMode){
player=blocks.find(b=>b.type=="player");
if(player){
startPos.x=player.x;
startPos.y=player.y;
}
}
}

function collide(a,b){
return a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y;
}

/* ---------- JOYSTICK ---------- */

let joy=document.getElementById("joy");
let knob=document.getElementById("knob");

joy.onpointermove=e=>{
if(!playMode||!player)return;
let rect=joy.getBoundingClientRect();
let x=e.clientX-rect.left-60;
let y=e.clientY-rect.top-60;
let max=30;
x=Math.max(-max,Math.min(max,x));
y=Math.max(-max,Math.min(max,y));
knob.style.left=(x+30)+"px";
knob.style.top=(y+30)+"px";
player.x+=x*0.1;
player.y+=y*0.1;
};

joy.onpointerup=()=>{
knob.style.left="30px";
knob.style.top="30px";
};

</script>
</body>
</html>
