<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluber Engine 2D</title>
<style>
body{margin:0;font-family:Arial;background:#1e1e1e;color:white;overflow:hidden}
#topbar{height:40px;background:#111;display:flex;align-items:center;padding:5px;gap:10px}
#workspace{position:absolute;left:250px;right:250px;top:40px;bottom:0;background:#222}
#explorer{position:absolute;left:0;top:40px;bottom:0;width:250px;background:#181818;overflow:auto;padding:10px}
#properties{position:absolute;right:0;top:40px;bottom:0;width:250px;background:#181818;overflow:auto;padding:10px}
button{background:#444;border:none;color:white;padding:5px;cursor:pointer}
input,textarea,select{width:100%;margin-bottom:5px;background:#333;color:white;border:none;padding:4px}
canvas{background:#111}
.joystick{
position:absolute;width:100px;height:100px;border-radius:50%;
background:rgba(255,255,255,0.1);bottom:20px;left:20px;display:none}
.knob{
position:absolute;width:50px;height:50px;border-radius:50%;
background:rgba(255,255,255,0.5);top:25px;left:25px}
.ui-element{position:absolute}
</style>
</head>
<body>

<div id="topbar">
<button onclick="addBlock()">Add Block</button>
<button onclick="addUI('button')">Add Button UI</button>
<button onclick="addUI('text')">Add Text UI</button>
<button onclick="togglePlay()">Play</button>
</div>

<div id="explorer"><h3>Explorer</h3><div id="explorerList"></div></div>
<div id="properties"><h3>Properties</h3><div id="props"></div></div>
<div id="workspace"><canvas id="game"></canvas></div>

<div class="joystick" id="joy">
<div class="knob" id="knob"></div>
</div>

<script>
let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");
let blocks=[];
let uiElements=[];
let selected=null;
let playMode=false;
let playerStart={x:100,y:100};
let player=null;
canvas.width=window.innerWidth-500;
canvas.height=window.innerHeight-40;

function addBlock(){
blocks.push({
name:"Block"+blocks.length,
x:100,y:100,w:80,h:80,
color:"white",
image:null,
script:"",
isMonster:false,
isPlayer:false
});
updateExplorer();
}

function addUI(type){
let el={
name:type+uiElements.length,
type:type,
x:200,y:200,
text:"UI",
script:""
};
uiElements.push(el);
updateExplorer();
renderUI();
}

function updateExplorer(){
let list=document.getElementById("explorerList");
list.innerHTML="";
blocks.forEach(b=>{
let div=document.createElement("div");
div.innerText=b.name;
div.onclick=()=>select(b);
list.appendChild(div);
});
uiElements.forEach(u=>{
let div=document.createElement("div");
div.innerText=u.name+" (UI)";
div.onclick=()=>select(u);
list.appendChild(div);
});
}

function select(obj){
selected=obj;
showProperties();
}

function showProperties(){
let p=document.getElementById("props");
p.innerHTML="";
if(!selected)return;

for(let key in selected){
if(key=="image")continue;
let input=document.createElement("input");
input.value=selected[key];
input.onchange=()=>selected[key]=input.value;
p.appendChild(document.createTextNode(key));
p.appendChild(input);
}
let apply=document.createElement("button");
apply.innerText="Aplicar";
apply.onclick=()=>renderUI();
p.appendChild(apply);
}

canvas.onmousedown=e=>{
if(playMode)return;
let mx=e.offsetX,my=e.offsetY;
blocks.forEach(b=>{
if(mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h){
selected=b;
select(b);
canvas.onmousemove=ev=>{
b.x=ev.offsetX-b.w/2;
b.y=ev.offsetY-b.h/2;
};
}
});
};
canvas.onmouseup=()=>canvas.onmousemove=null;

function togglePlay(){
playMode=!playMode;
document.getElementById("joy").style.display=playMode?"block":"none";
if(playMode){
player=blocks.find(b=>b.isPlayer);
if(player){
playerStart.x=player.x;
playerStart.y=player.y;
}
}
}

function gameLoop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
if(b.image){
let img=new Image();
img.src=b.image;
ctx.drawImage(img,b.x,b.y,b.w,b.h);
}else{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
}
});

if(playMode){
blocks.forEach(b=>{
if(b.script){
try{eval(b.script)}catch{}
}
if(b.isMonster&&player){
let dx=player.x-b.x;
let dy=player.y-b.y;
b.x+=dx*0.02;
b.y+=dy*0.02;
if(collide(b,player)){
player.x=playerStart.x;
player.y=playerStart.y;
}
}
});
}
requestAnimationFrame(gameLoop);
}
gameLoop();

function collide(a,b){
return a.x<a.x+a.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y;
}

/* JOYSTICK */
let joy=document.getElementById("joy");
let knob=document.getElementById("knob");
let joyData={x:0,y:0};

joy.onpointermove=e=>{
if(!playMode)return;
let rect=joy.getBoundingClientRect();
let x=e.clientX-rect.left-50;
let y=e.clientY-rect.top-50;
let max=25;
x=Math.max(-max,Math.min(max,x));
y=Math.max(-max,Math.min(max,y));
knob.style.left=(x+25)+"px";
knob.style.top=(y+25)+"px";
joyData.x=x/25;
joyData.y=y/25;
if(player){
player.x+=joyData.x*5;
player.y+=joyData.y*5;
}
};

joy.onpointerup=()=>{
knob.style.left="25px";
knob.style.top="25px";
joyData.x=0;joyData.y=0;
};

function renderUI(){
document.querySelectorAll(".ui-element").forEach(e=>e.remove());
uiElements.forEach(u=>{
let el;
if(u.type=="button"){
el=document.createElement("button");
el.innerText=u.text;
}
if(u.type=="text"){
el=document.createElement("div");
el.innerText=u.text;
}
el.className="ui-element";
el.style.left=u.x+"px";
el.style.top=u.y+"px";
el.onclick=()=>{ if(u.script) eval(u.script); };
document.body.appendChild(el);
});
}
</script>

</body>
</html>
