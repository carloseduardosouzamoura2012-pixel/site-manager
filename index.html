<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mini Engine 2D</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
canvas { background:#222; display:block; margin:0 auto; }
#ui {
position:fixed;
top:10px;
left:10px;
background:#000a;
padding:10px;
border-radius:10px;
color:white;
font-family:Arial;
}
button { margin:5px; padding:5px 10px; }
</style>
</head>
<body>

<div id="ui">
<button onclick="addBlock()">Adicionar Bloco</button>
<button onclick="toggleMode()">Modo: Jogar</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let blocks = [];
let mode = "play";

let player = {
x:100,
y:100,
w:40,
h:40,
vx:0,
vy:0,
speed:5,
jump:-12,
grounded:false
};

function addBlock(){
blocks.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
w:80,
h:20
});
}

function toggleMode(){
mode = mode === "play" ? "edit" : "play";
document.querySelector("#ui button:nth-child(2)").innerText =
"Modo: " + (mode === "play" ? "Jogar" : "Editar");
}

let keys = {};
window.addEventListener("keydown",e=>keys[e.key]=true);
window.addEventListener("keyup",e=>keys[e.key]=false);

function update(){
if(mode==="play"){
player.vx = 0;
if(keys["a"]) player.vx = -player.speed;
if(keys["d"]) player.vx = player.speed;

if(keys["w"] && player.grounded){
player.vy = player.jump;
player.grounded = false;
}

player.vy += 0.6;
player.x += player.vx;
player.y += player.vy;

player.grounded = false;
blocks.forEach(b=>{
if(player.x < b.x+b.w &&
player.x+player.w > b.x &&
player.y < b.y+b.h &&
player.y+player.h > b.y){
player.y = b.y - player.h;
player.vy = 0;
player.grounded = true;
}
});
}

draw();
requestAnimationFrame(update);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="lime";
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle="white";
blocks.forEach(b=>{
ctx.fillRect(b.x,b.y,b.w,b.h);
});
}

update();
</script>

</body>
</html>
