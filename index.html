<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bluber Engine 2D</title>
<style>
body{margin:0;background:#111;font-family:Arial;color:white;overflow:hidden;}
.window{position:absolute;background:#1c1c1c;border:1px solid #333;border-radius:8px;resize:both;overflow:hidden;display:flex;flex-direction:column;}
.header{background:#2a2a2a;padding:6px;cursor:move;font-weight:bold;}
.content{flex:1;padding:8px;overflow:auto;}
#viewport{top:10px;left:10px;width:60%;height:70%;}
#inspector{top:10px;right:10px;width:35%;height:70%;}
#assets{bottom:10px;left:10px;width:60%;height:20%;}
canvas{background:#222;width:100%;height:100%;}
input,button,textarea,select{width:100%;margin-top:5px;background:#2a2a2a;color:white;border:1px solid #444;padding:5px;border-radius:5px;}
</style>
</head>
<body>

<div class="window" id="viewport">
<div class="header">Viewport</div>
<canvas id="game"></canvas>
</div>

<div class="window" id="inspector">
<div class="header">Inspector</div>
<div class="content">
<label>X</label><input id="propX">
<label>Y</label><input id="propY">
<label>Width</label><input id="propW">
<label>Height</label><input id="propH">
<label>Color</label><input type="color" id="propColor">
<label>Tipo</label>
<select id="propType">
<option value="normal">Normal</option>
<option value="monster">Monstro</option>
</select>
<button onclick="applyChanges()">Aplicar</button>
</div>
</div>

<div class="window" id="assets">
<div class="header">Assets</div>
<div class="content">
<button onclick="addBlock()">Adicionar Bloco</button>
<button onclick="toggleMode()">Play/Edit</button>
<input type="file" id="imgLoader">
</div>
</div>

<script>
/* DRAG JANELAS */
document.querySelectorAll(".window").forEach(win=>{
let header=win.querySelector(".header");
let offsetX,offsetY,isDown=false;
header.onmousedown=e=>{
isDown=true;
offsetX=e.clientX-win.offsetLeft;
offsetY=e.clientY-win.offsetTop;
}
document.onmouseup=()=>isDown=false;
document.onmousemove=e=>{
if(isDown){
win.style.left=e.clientX-offsetX+"px";
win.style.top=e.clientY-offsetY+"px";
}
}
});

/* ENGINE */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=800;
canvas.height=500;

let blocks=[];
let selected=null;
let dragging=false;
let mode="edit";

let player={x:0,y:0,w:40,h:40,vy:0,startX:0,startY:0};

/* CRIAR BLOCO */
function addBlock(){
let block={
x:100,y:100,w:100,h:60,
color:"#ffffff",
img:null,
type:"normal"
};
blocks.push(block);
if(blocks.length===1){
player.startX=block.x;
player.startY=block.y-40;
resetPlayer();
}
}

/* RESET PLAYER */
function resetPlayer(){
player.x=player.startX;
player.y=player.startY;
player.vy=0;
}

/* SELECIONAR + ARRASTAR */
canvas.addEventListener("mousedown",e=>{
if(mode!=="edit")return;
let rect=canvas.getBoundingClientRect();
let mx=(e.clientX-rect.left)*(canvas.width/rect.width);
let my=(e.clientY-rect.top)*(canvas.height/rect.height);
selected=null;

blocks.forEach(b=>{
if(mx>b.x && mx<b.x+b.w && my>b.y && my<b.y+b.h){
selected=b;
updateInspector();
dragging=true;
}
});
});

canvas.addEventListener("mousemove",e=>{
if(dragging && selected){
let rect=canvas.getBoundingClientRect();
let mx=(e.clientX-rect.left)*(canvas.width/rect.width);
let my=(e.clientY-rect.top)*(canvas.height/rect.height);
selected.x=mx-selected.w/2;
selected.y=my-selected.h/2;
updateInspector();
}
});

canvas.addEventListener("mouseup",()=>dragging=false);

/* INSPECTOR */
function updateInspector(){
if(!selected)return;
propX.value=selected.x;
propY.value=selected.y;
propW.value=selected.w;
propH.value=selected.h;
propColor.value=selected.color;
propType.value=selected.type;
}

function applyChanges(){
if(!selected)return;
selected.x=parseInt(propX.value);
selected.y=parseInt(propY.value);
selected.w=parseInt(propW.value);
selected.h=parseInt(propH.value);
selected.color=propColor.value;
selected.type=propType.value;
}

/* IMPORTAR IMAGEM */
imgLoader.addEventListener("change",e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(event){
let img=new Image();
img.src=event.target.result;
let block={
x:150,y:150,w:100,h:100,
color:"#ffffff",
img:img,
type:"normal"
};
blocks.push(block);
};
reader.readAsDataURL(file);
});

/* PLAY MODE */
function toggleMode(){
mode=mode==="edit"?"play":"edit";
}

/* LOOP */
function update(){
if(mode==="play"){
player.vy+=0.5;
player.y+=player.vy;

blocks.forEach(b=>{
// COLISÃO CHÃO
if(player.x<b.x+b.w &&
player.x+player.w>b.x &&
player.y<b.y+b.h &&
player.y+player.h>b.y){
player.y=b.y-player.h;
player.vy=0;
}

// MONSTRO SEGUE PLAYER
if(b.type==="monster"){
let dx=player.x-b.x;
let dy=player.y-b.y;
let dist=Math.sqrt(dx*dx+dy*dy);
if(dist>1){
b.x+=dx/dist*1.5;
b.y+=dy/dist*1.5;
}

// SE ENCOSTAR → RESET
if(player.x<b.x+b.w &&
player.x+player.w>b.x &&
player.y<b.y+b.h &&
player.y+player.h>b.y){
resetPlayer();
}
}
});
}

draw();
requestAnimationFrame(update);
}

/* DESENHO */
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

blocks.forEach(b=>{
if(b.img){
ctx.drawImage(b.img,b.x,b.y,b.w,b.h);
}else{
ctx.fillStyle=b.color;
ctx.fillRect(b.x,b.y,b.w,b.h);
}
});

ctx.fillStyle="lime";
ctx.fillRect(player.x,player.y,player.w,player.h);
}

update();
</script>
</body>
</html>
