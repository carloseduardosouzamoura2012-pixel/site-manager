<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bluber Engine 2D</title>

<style>
body{
margin:0;
background:#0f172a;
font-family:Arial;
overflow:hidden;
touch-action:none;
}

.window{
position:absolute;
background:#1e293b;
border-radius:10px;
padding:10px;
color:white;
box-shadow:0 0 10px #000;
overflow:auto;
}

#explorer{left:10px;top:10px;width:200px;height:300px;}
#properties{right:10px;top:10px;width:260px;height:350px;}
#uiEditor{left:10px;bottom:10px;width:200px;height:250px;}
#gameView{left:220px;top:10px;right:280px;bottom:10px;background:#111;border-radius:10px;}

button{
background:#2563eb;
border:none;
padding:6px;
border-radius:6px;
color:white;
margin:2px 0;
width:100%;
}

input,textarea{
width:100%;
margin:3px 0;
border-radius:5px;
border:none;
padding:4px;
}

textarea{height:60px;}

#joystick{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
width:120px;
height:120px;
background:rgba(255,255,255,0.1);
border-radius:50%;
display:none;
touch-action:none;
}

#stick{
width:50px;
height:50px;
background:#2563eb;
border-radius:50%;
position:absolute;
left:35px;
top:35px;
}
</style>
</head>

<body>

<div id="explorer" class="window">
<h3>Explorer</h3>
<button onclick="addBlock()">+ Bloco</button>
<button onclick="addPlayer()">+ Player</button>
<button onclick="addMonster()">+ Monstro</button>
<button onclick="addUIButton()">+ UI Botão</button>
<button onclick="addUIText()">+ UI Texto</button>
<button onclick="saveProject()">Exportar</button>
<button onclick="loadProject()">Importar</button>
<div id="objectList"></div>
</div>

<div id="properties" class="window">
<h3>Propriedades</h3>
<div id="propContent">Selecione algo</div>
</div>

<div id="uiEditor" class="window">
<h3>Editor UI</h3>
<p>UI aparece no modo Play</p>
</div>

<div id="gameView" class="window">
<canvas id="game"></canvas>
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<script>

let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");
let gameView=document.getElementById("gameView");
let objects=[];
let uiObjects=[];
let selected=null;
let mode="edit";
let player=null;

function resize(){
canvas.width=gameView.clientWidth;
canvas.height=gameView.clientHeight;
}
window.onresize=resize;
resize();

function addBlock(){
objects.push({type:"block",x:100,y:100,w:80,h:80,color:"#ffffff",image:null,script:""});
updateExplorer();
}

function addPlayer(){
let p={type:"player",x:50,y:50,w:50,h:50,color:"cyan",image:null,script:""};
objects.push(p);
player=p;
updateExplorer();
}

function addMonster(){
objects.push({type:"monster",x:200,y:100,w:50,h:50,color:"red",image:null,script:""});
updateExplorer();
}

function addUIButton(){
uiObjects.push({type:"button",text:"Botão",x:50,y:50,w:100,h:40,color:"#2563eb",script:""});
}

function addUIText(){
uiObjects.push({type:"text",text:"Texto",x:50,y:100,size:20,color:"white",script:""});
}

function updateExplorer(){
let list=document.getElementById("objectList");
list.innerHTML="";
objects.forEach((o,i)=>{
let div=document.createElement("div");
div.innerHTML=o.type+" "+i;
div.onclick=()=>selectObject(o);
list.appendChild(div);
});
}

function selectObject(o){
selected=o;
showProperties(o);
}

function showProperties(o){
let p=document.getElementById("propContent");
p.innerHTML=`
X<input type="number" value="${o.x}" oninput="selected.x=this.value">
Y<input type="number" value="${o.y}" oninput="selected.y=this.value">
Largura<input type="number" value="${o.w}" oninput="selected.w=this.value">
Altura<input type="number" value="${o.h}" oninput="selected.h=this.value">
Cor<input type="color" value="${o.color}" oninput="selected.color=this.value">
Imagem<input type="file" onchange="importImage(event)">
Script<textarea oninput="selected.script=this.value">${o.script}</textarea>
`;
}

function importImage(e){
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(ev){
let img=new Image();
img.src=ev.target.result;
selected.image=img;
};
reader.readAsDataURL(file);
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

objects.forEach(o=>{
if(o.image){
ctx.drawImage(o.image,o.x,o.y,o.w,o.h);
}else{
ctx.fillStyle=o.color;
ctx.fillRect(o.x,o.y,o.w,o.h);
}
});

if(mode==="play"){
uiObjects.forEach(u=>{
if(u.type==="button"){
ctx.fillStyle=u.color;
ctx.fillRect(u.x,u.y,u.w,u.h);
ctx.fillStyle="white";
ctx.fillText(u.text,u.x+10,u.y+25);
}
if(u.type==="text"){
ctx.fillStyle=u.color;
ctx.font=u.size+"px Arial";
ctx.fillText(u.text,u.x,u.y);
}
});
}
}

function gameLoop(){
if(mode==="play"){
updateGame();
}
draw();
requestAnimationFrame(gameLoop);
}
gameLoop();

function updateGame(){

objects.forEach(o=>{
if(o.script){
try{eval(o.script);}catch(e){}
}
});

objects.forEach(o=>{
if(o.type==="monster" && player){
let dx=player.x-o.x;
let dy=player.y-o.y;
let dist=Math.hypot(dx,dy);
if(dist>1){
o.x+=dx/dist;
o.y+=dy/dist;
}
if(dist<40){
player.x=50;
player.y=50;
}
}
});
}

function saveProject(){
let data={
objects:objects.map(o=>({...o,image:null})),
ui:uiObjects
};
let blob=new Blob([JSON.stringify(data)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="BluberProject.json";
a.click();
}

function loadProject(){
let input=document.createElement("input");
input.type="file";
input.onchange=e=>{
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=function(ev){
let data=JSON.parse(ev.target.result);
objects=data.objects||[];
uiObjects=data.ui||[];
updateExplorer();
};
reader.readAsText(file);
};
input.click();
}

/* JOYSTICK FIXADO */

let joy=document.getElementById("joystick");
let stick=document.getElementById("stick");
let joyActive=false;
let joyX=0;
let joyY=0;

joy.addEventListener("touchstart",e=>{
joyActive=true;
});

joy.addEventListener("touchmove",e=>{
if(!joyActive)return;
let rect=joy.getBoundingClientRect();
let touch=e.touches[0];
let x=touch.clientX-rect.left-60;
let y=touch.clientY-rect.top-60;
let dist=Math.min(40,Math.hypot(x,y));
let angle=Math.atan2(y,x);
joyX=Math.cos(angle)*dist;
joyY=Math.sin(angle)*dist;
stick.style.left=35+joyX+"px";
stick.style.top=35+joyY+"px";
});

joy.addEventListener("touchend",()=>{
joyActive=false;
joyX=0;
joyY=0;
stick.style.left="35px";
stick.style.top="35px";
});

function updateGame(){
if(player){
player.x+=joyX*0.1;
player.y+=joyY*0.1;
}

objects.forEach(o=>{
if(o.script){
try{eval(o.script);}catch(e){}
}
});

objects.forEach(o=>{
if(o.type==="monster" && player){
let dx=player.x-o.x;
let dy=player.y-o.y;
let dist=Math.hypot(dx,dy);
if(dist>1){
o.x+=dx/dist;
o.y+=dy/dist;
}
if(dist<40){
player.x=50;
player.y=50;
}
}
});
}

</script>

</body>
</html>
